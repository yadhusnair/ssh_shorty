name: Test macOS install (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show stock bash version
        run: |
          echo "Stock /bin/bash:"
          /bin/bash --version | head -1

      - name: Run install.sh (simulates curl one-liner on a fresh Mac)
        run: |
          bash install.sh

      - name: Verify installed s runs (mapfile / ${var,,} / local -n need bash4+)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Installed s shebang:"
          head -1 "$HOME/.local/bin/s"
          echo ""
          echo "bash resolved by that shebang:"
          "$(head -1 "$HOME/.local/bin/s" | sed 's/^#!//')" --version | head -1
          echo ""
          echo "s --help:"
          s --help
          echo ""
          echo "s --list:"
          s --list

      - name: Stand up a local sshd target (brew's openssh, not the system one — avoids Remote Login/TCC)
        run: |
          brew install openssh tmux
          mkdir -p /tmp/sshd_test
          ssh-keygen -t ed25519 -N "" -f /tmp/sshd_test/host_key -q
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519_test" -q
          cp "$HOME/.ssh/id_ed25519_test.pub" /tmp/sshd_test/authorized_keys
          chmod 700 "$HOME/.ssh"
          chmod 600 /tmp/sshd_test/authorized_keys /tmp/sshd_test/host_key

          cat > /tmp/sshd_test/sshd_config << EOF
          Port 2222
          ListenAddress 127.0.0.1
          ListenAddress 127.0.0.2
          HostKey /tmp/sshd_test/host_key
          AuthorizedKeysFile /tmp/sshd_test/authorized_keys
          PasswordAuthentication no
          PubkeyAuthentication yes
          UsePAM no
          StrictModes no
          PidFile /tmp/sshd_test/sshd.pid
          LogLevel ERROR
          EOF

          # citest2 (below) uses 127.0.0.2 to dodge s --add's duplicate-IP guard
          # (which only compares host, not port). macOS routes all of 127.0.0.0/8
          # to lo0 but doesn't pre-assign every alias the way Linux effectively
          # does — and sshd only binds at its own startup, so the alias has to
          # exist BEFORE sshd starts, not be added after.
          sudo ifconfig lo0 alias 127.0.0.2 up
          "$(brew --prefix openssh)/sbin/sshd" -f /tmp/sshd_test/sshd_config -E /tmp/sshd_test/sshd.log
          sleep 1
          nc -z 127.0.0.1 2222 && echo "sshd is up on 127.0.0.1:2222" || { echo "sshd failed to start"; cat /tmp/sshd_test/sshd.log; exit 1; }
          nc -z 127.0.0.2 2222 && echo "sshd is up on 127.0.0.2:2222" || { echo "sshd failed to start on 127.0.0.2"; cat /tmp/sshd_test/sshd.log; exit 1; }

      - name: Register the local sshd as two devices (real s --add, not hand-edited machines.txt)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          s --add citest1 "$(whoami)@127.0.0.1" port=2222 "key=$HOME/.ssh/id_ed25519_test"
          s --add citest2 "$(whoami)@127.0.0.2" port=2222 "key=$HOME/.ssh/id_ed25519_test"
          s --list

      - name: Real SSH connect test (s <nick> <remote command>)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          out=$(s citest1 echo mac-ssh-connect-ok)
          echo "output: $out"
          [[ "$out" == *"mac-ssh-connect-ok"* ]] || { echo "SSH connect via s did not return expected output"; exit 1; }

      - name: Real tmux multi-device test (s <nick1> <nick2> opens a tmux window each)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # macOS has no GNU `timeout`; background it and kill after a grace period
          # instead (the tmux session is created detached before s ever tries to
          # attach, so this is just a safety net, not the thing under test).
          s citest1 citest2 </dev/null >/tmp/tmux_multi.out 2>&1 &
          spid=$!
          sleep 5
          kill "$spid" 2>/dev/null || true
          wait "$spid" 2>/dev/null || true
          echo "--- s output ---"; cat /tmp/tmux_multi.out
          sleep 3

          session=$(tmux list-sessions -F '#{session_name}' | grep '^sshorty_' | head -1)
          echo "tmux session: $session"
          [[ -n "$session" ]] || { echo "no tmux session created"; exit 1; }

          echo "--- windows ---"
          tmux list-windows -t "$session"
          win_count=$(tmux list-windows -t "$session" | wc -l | tr -d ' ')

          # Capture whatever panes exist BEFORE asserting, so a failure still
          # tells us why (e.g. a window's ssh command errored and tmux's default
          # remain-on-exit=off closed the window before we ever asserted).
          for nick in citest1 citest2; do
            echo "--- pane content: $nick ---"
            tmux capture-pane -p -t "${session}:${nick}" 2>&1 || echo "(no such window: $nick)"
          done

          tmux kill-session -t "$session" 2>/dev/null || true

          [[ "$win_count" -eq 2 ]] || { echo "expected 2 tmux windows, got $win_count"; exit 1; }

      - name: Clean up local sshd
        if: always()
        run: |
          [[ -f /tmp/sshd_test/sshd.pid ]] && kill "$(cat /tmp/sshd_test/sshd.pid)" 2>/dev/null || true

      - name: Build local tarball + a real local tap (brew rejects bare formula files)
        run: |
          VER="$(cat VERSION)"
          git archive --prefix="ssh_shorty-${VER}/" HEAD | gzip > "/tmp/ssh_shorty-${VER}.tar.gz"
          SHA=$(shasum -a 256 "/tmp/ssh_shorty-${VER}.tar.gz" | awk '{print $1}')

          brew tap-new local/test
          TAP_DIR="$(brew --repository)/Library/Taps/local/homebrew-test"
          sed \
            -e "s|url \".*\"|url \"file:///tmp/ssh_shorty-${VER}.tar.gz\"|" \
            -e "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            -e "s|version \".*\"|version \"${VER}\"|" \
            Formula/s.rb > "${TAP_DIR}/Formula/s.rb"
          echo "--- formula used ---"
          cat "${TAP_DIR}/Formula/s.rb"

      - name: brew install s (from local tap, exercises depends_on bash + inreplace)
        run: |
          brew install --verbose local/test/s

      - name: Verify brew-installed s
        run: |
          BREW_S="$(brew --prefix)/bin/s"
          echo "brew-installed s shebang:"
          head -1 "$BREW_S"
          echo ""
          echo "s --help (via brew):"
          "$BREW_S" --help
          echo ""
          echo "s --list (via brew):"
          "$BREW_S" --list

      - name: brew test
        run: brew test s
